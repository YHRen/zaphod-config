# Keep both endpoints available. USB CDC logging is intentionally enabled for
# the first hardware bring-up; BLE remains enabled for wireless pointer tests.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_POINTING=y

# Initialization and PS/2 transport messages are useful without enabling the
# transport's very timing-sensitive interrupt debug trace.
CONFIG_ZMK_LOG_LEVEL_INF=y
CONFIG_PS2_LOG_LEVEL_INF=y
