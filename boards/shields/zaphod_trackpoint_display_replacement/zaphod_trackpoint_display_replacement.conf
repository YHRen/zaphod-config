# Keyboard + movement-only TrackPoint, with the Sharp display removed.
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_DISPLAY=n
CONFIG_ZAPHOD_BONGO_CAT=n
CONFIG_DISPLAY=n
CONFIG_LVGL=n
CONFIG_LS0XX=n
CONFIG_SPI=n
CONFIG_PM_DEVICE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
# Supplied by the tracked patch against the pinned PS/2 module.
CONFIG_PS2_UART_OPEN_DRAIN=y
